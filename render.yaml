services:
  - type: web
    name: lawlens-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        value: lawlens-f0ebc.firebaseapp.com
      - key: FIREBASE_PROJECT_ID
        value: lawlens-f0ebc
      - key: FIREBASE_STORAGE_BUCKET
        value: lawlens-f0ebc.firebasestorage.app
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: 729621375997
      - key: FIREBASE_APP_ID
        value: 1:729621375997:web:be1ef7c92507abaf798794
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CORS_ORIGIN
        value: https://lawlens.web.app,https://lawlens-f0ebc.web.app
      - key: DB_PATH
        value: ./database
      - key: UPLOAD_DIR
        value: ./uploads
      - key: VECTOR_DB_PATH
        value: ./vector/index.json
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
    healthCheckPath: /health
    autoDeploy: true
