<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./favicon-128.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Search — LawLens</title>
  <meta name="description" content="Search across Indian legal documents with AI-powered semantic search. Find articles, sections, and case law.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/design-system.css">
  <link rel="stylesheet" href="./css/shell.css">
  <link rel="stylesheet" href="./css/search-v3.css">
</head>
<body>
  <div class="search-layout">
    <!-- Filters Sidebar -->
    <aside class="search-sidebar" id="searchSidebar">
      <div class="search-sidebar-header">
        <div class="search-sidebar-title">Filters</div>
        
        <div class="search-filters">
          <div class="search-filter-group">
            <div class="search-filter-label">Source Type</div>
            <div class="search-filter-options">
              <button class="search-filter-option active" data-filter="all">All</button>
              <button class="search-filter-option" data-filter="constitution">Constitution</button>
              <button class="search-filter-option" data-filter="ipc">IPC</button>
              <button class="search-filter-option" data-filter="cpc">CPC</button>
              <button class="search-filter-option" data-filter="case-law">Case Law</button>
            </div>
          </div>
          
          <div class="search-filter-group">
            <div class="search-filter-label">Part</div>
            <div class="search-filter-options">
              <button class="search-filter-option" data-filter="part-3">Part III</button>
              <button class="search-filter-option" data-filter="part-4">Part IV</button>
              <button class="search-filter-option" data-filter="part-5">Part V</button>
            </div>
          </div>
          
          <div class="search-filter-group">
            <div class="search-filter-label">Relevance</div>
            <div class="search-filter-options">
              <button class="search-filter-option active" data-filter="relevance">Most Relevant</button>
              <button class="search-filter-option" data-filter="recent">Most Recent</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Search Area -->
    <main class="search-main">
      <!-- Search Header -->
      <header class="search-header">
        <div class="search-input-wrapper">
          <div class="search-input-container">
            <i data-lucide="search" class="search-input-icon" style="width:20px;height:20px;"></i>
            <input 
              type="text" 
              class="search-input" 
              id="searchInput"
              placeholder="Search legal documents..."
              autofocus
            >
            <div class="search-input-actions">
              <button class="search-mode-btn active" data-mode="legal">Legal Database</button>
              <button class="search-mode-btn" data-mode="web">Web Search</button>
              <button class="search-submit-btn" id="searchBtn">
                <i data-lucide="search" style="width:16px;height:16px;"></i>
                Search
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Search Results -->
      <div class="search-results" id="searchResults">
        <!-- Empty State -->
        <div class="search-empty" id="searchEmpty">
          <div class="search-empty-icon">
            <i data-lucide="search" style="width:40px;height:40px;"></i>
          </div>
          <h2 class="search-empty-title">Search legal documents</h2>
          <p class="search-empty-description">
            Find articles, sections, and case law from the Indian Constitution, IPC, CPC, and more.
          </p>
        </div>
        
        <!-- Results (generated by JS) -->
        <div id="resultsList" style="display:none;">
          <div class="search-results-header">
            <div class="search-results-count" id="resultsCount">0 results</div>
            <div class="search-results-sort">
              <span style="font-size:var(--text-xs);color:var(--text-tertiary);">Sort by:</span>
              <select id="sortSelect">
                <option value="relevance">Relevance</option>
                <option value="date">Date</option>
                <option value="source">Source</option>
              </select>
            </div>
          </div>
          <div id="resultsContainer"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/search.js"></script>
</body>
</html>
