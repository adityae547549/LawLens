<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - LawLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div style="text-align:center;padding:2rem;" class="animate-fadeIn">

    <h2 style="margin-bottom:1rem;">Page Not Found</h2>
    <p style="color:var(--text-tertiary);margin-bottom:2rem;font-size:1.1rem;">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:1rem;justify-content:center;">
      <a href="./dashboard.html" class="btn btn-primary">Go to Dashboard</a>
      <a href="./index.html" class="btn btn-secondary">Back to Home</a>
    </div>
    <div style="margin-top:2rem;">
      <a href="./feedback.html" style="font-size:0.82rem;color:var(--text-tertiary);text-decoration:none;">Report an issue</a>
    </div>
  </div>
  <script src="./js/utils.js"></script>
  <script src="./js/app.js"></script>
