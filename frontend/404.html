<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./favicon-128.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — LawLens</title>
  <meta name="description" content="The page you're looking for doesn't exist on LawLens.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/design-system.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ui-enhancements.css">
  <style>
    .error-page { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:var(--spacing-xl); }
    .error-card { text-align:center; max-width:500px; }
    .error-code { font-size:6rem; font-weight:800; background:var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; margin-bottom:var(--spacing-md); }
    .error-title { font-size:1.5rem; font-weight:600; margin-bottom:var(--spacing-sm); }
    .error-desc { color:var(--text-tertiary); margin-bottom:var(--spacing-xl); line-height:1.6; }
  </style>
</head>
<body>
  <div class="blob-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <main class="error-page">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div style="display:flex;gap:var(--spacing-md);justify-content:center;flex-wrap:wrap;">
        <a href="./index.html" class="btn btn-primary">Go Home</a>
        <a href="./dashboard.html" class="btn btn-outline">Dashboard</a>
        <a href="./chat.html" class="btn btn-outline">AI Chat</a>
      </div>
    </div>
  </main>
</body>
</html>
