<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./favicon-128.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat — LawLens</title>
  <meta name="description" content="Ask legal questions in plain English and get accurate, cited answers from Indian law sources.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/design-system.css">
  <link rel="stylesheet" href="./css/shell.css">
  <link rel="stylesheet" href="./css/chat-v3.css">
</head>
<body>
  <div class="chat-layout">
    <!-- Conversations Sidebar -->
    <aside class="chat-sidebar" id="chatSidebar">
      <div class="chat-sidebar-header">
        <div class="chat-sidebar-title">Conversations</div>
        <button class="chat-new-btn" id="newChatBtn">
          <i data-lucide="plus" style="width:16px;height:16px;"></i>
          New Chat
        </button>
      </div>
      
      <div class="chat-sidebar-search">
        <input type="text" placeholder="Search conversations..." id="conversationSearch">
      </div>
      
      <div class="chat-conversations" id="conversationsList">
        <!-- Generated by JS -->
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="chat-header-left">
          <button class="hamburger" id="hamburger" aria-label="Toggle conversations">
            <i data-lucide="menu" style="width:20px;height:20px;"></i>
          </button>
          <h1 class="chat-header-title" id="chatTitle">New Conversation</h1>
          <span class="chat-header-mode" id="chatMode">
            <i data-lucide="database" style="width:10px;height:10px;"></i>
            Legal Database
          </span>
        </div>
        <div class="chat-header-right">
          <button class="topbar-action" id="modeToggle" aria-label="Toggle search mode">
            <i data-lucide="globe" style="width:18px;height:18px;"></i>
          </button>
          <button class="topbar-action" id="chatHistory" aria-label="History">
            <i data-lucide="clock" style="width:18px;height:18px;"></i>
          </button>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <i data-lucide="moon" style="width:18px;height:18px;"></i>
          </button>
        </div>
      </header>

      <!-- Chat Messages -->
      <div class="chat-messages" id="chatMessages">
        <!-- Empty State -->
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-icon">
            <i data-lucide="message-square" style="width:40px;height:40px;"></i>
          </div>
          <h2 class="chat-empty-title">Ask LawLens</h2>
          <p class="chat-empty-description">
            Ask any legal question about Indian law. Get accurate answers with source citations.
          </p>
          <div class="chat-empty-suggestions">
            <button class="chat-empty-suggestion" data-query="What is Article 21?">
              <i data-lucide="book-open" style="width:16px;height:16px;"></i>
              What is Article 21?
            </button>
            <button class="chat-empty-suggestion" data-query="Explain the right to privacy">
              <i data-lucide="shield" style="width:16px;height:16px;"></i>
              Right to Privacy
            </button>
            <button class="chat-empty-suggestion" data-query="What are Fundamental Rights?">
              <i data-lucide="scale" style="width:16px;height:16px;"></i>
              Fundamental Rights
            </button>
            <button class="chat-empty-suggestion" data-query="Explain Article 14">
              <i data-lucide="search" style="width:16px;height:16px;"></i>
              Article 14
            </button>
          </div>
        </div>
      </div>

      <!-- Chat Composer -->
      <div class="chat-composer">
        <div class="chat-composer-inner">
          <div class="chat-composer-suggestions" id="composerSuggestions">
            <!-- Generated by JS based on context -->
          </div>
          <div class="chat-composer-input">
            <textarea 
              class="chat-composer-textarea" 
              id="chatInput"
              placeholder="Ask a question about Indian law..."
              rows="1"
            ></textarea>
            <div class="chat-composer-actions">
              <button class="chat-composer-btn" id="attachBtn" aria-label="Attach file">
                <i data-lucide="paperclip" style="width:18px;height:18px;"></i>
              </button>
              <button class="chat-composer-btn send" id="sendBtn" aria-label="Send message">
                <i data-lucide="send" style="width:18px;height:18px;"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/chat.js"></script>
</body>
</html>
