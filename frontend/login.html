<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LawLens</title>
  <meta name="description" content="Sign in to LawLens for AI-powered legal research grounded in Indian legal sources.">
  <link rel="canonical" href="https://lawlens.web.app/login.html">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ui-enhancements.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <div class="blob-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <img src="./logo.png" alt="LawLens">
          </div>
          <h1>Welcome back</h1>
          <p>Sign in to continue your legal research</p>
        </div>

        <div id="loginError" role="alert" style="display:none;background:rgba(239,68,68,0.1);color:var(--error);padding:0.75rem 1rem;border-radius:var(--radius-md);margin-bottom:1rem;font-size:0.9rem;border-left:3px solid var(--error);"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" autofocus>
            <div class="form-error" id="loginEmailError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="password-toggle" tabindex="-1"><i data-lucide="eye" style="width:18px;height:18px;"></i></button>
            </div>
            <div class="form-error" id="loginPasswordError"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="google-btn" id="googleLoginBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>

        <div class="auth-footer">
          Don't have an account? <a href="./register.html">Create one</a>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
