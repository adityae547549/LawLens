<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Legal Research Content | LawLens</title>
  <meta name="description" content="Shared legal research content.">
  <link rel="canonical" href="https://lawlens.web.app/shared.html">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .shared-container{max-width:800px;margin:2rem auto;padding:0 1.5rem;}
    .shared-header{text-align:center;margin-bottom:2rem;padding:2rem;background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-color);}
    .shared-header h1{font-size:1.5rem;margin-bottom:0.5rem;}
    .shared-content{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:2rem;line-height:1.8;font-size:0.95rem;white-space:pre-wrap;}
    .shared-sources{margin-top:1.5rem;padding:1rem;background:var(--bg-secondary);border-radius:var(--radius-md);font-size:0.85rem;color:var(--text-tertiary);}
    .shared-footer{text-align:center;margin-top:2rem;padding:1rem;font-size:0.8rem;color:var(--text-tertiary);}
    .shared-cta{display:inline-block;margin-top:1rem;padding:0.6rem 1.5rem;background:var(--accent-primary);color:white;border-radius:var(--radius-md);text-decoration:none;font-weight:500;}
    .shared-cta:hover{opacity:0.9;}
  </style>
</head>
<body>
  <div class="shared-container">
    <div class="shared-header">
      <div style="margin-bottom:0.5rem;"><i data-lucide="scale" style="width:40px;height:40px;color:var(--accent-primary);"></i></div>
      <h1>LawLens</h1>
      <p style="color:var(--text-tertiary);">AI-Powered Legal Research — Shared Answer</p>
    </div>
    <div class="shared-content" id="sharedContent">
      <div style="text-align:center;padding:2rem;color:var(--text-tertiary);">
        <div class="loading-spinner" style="margin:0 auto 1rem;"></div>
        Loading shared content...
      </div>
    </div>
    <div class="shared-sources" id="sharedSources" style="display:none;"></div>
    <div class="shared-footer">
      <p>This answer was generated by LawLens AI. Always verify with official sources.</p>
      <p style="margin-top:0.5rem;">This is not legal advice.</p>
      <a href="/" class="shared-cta">Try LawLens →</a>
      <div style="margin-top:0.75rem;"><a href="./feedback.html" style="font-size:0.78rem;color:var(--text-tertiary);text-decoration:none;">Send Feedback</a></div>
    </div>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const contentEl = document.getElementById('sharedContent');
    const sourcesEl = document.getElementById('sharedSources');

    if (!token) {
      contentEl.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--error);">Invalid share link.</div>';
    } else {
      fetch('/api/share/' + token)
        .then(r => r.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          contentEl.innerHTML = '<pre style="font-family:inherit;white-space:pre-wrap;margin:0;">' + data.content + '</pre>';
          if (data.citations && data.citations.length > 0) {
            sourcesEl.style.display = 'block';
            sourcesEl.innerHTML = '<strong>Sources:</strong><br>' + data.citations.map((c, i) =>
              '<span style="display:inline-block;margin:2px 4px;padding:2px 8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:4px;font-size:0.8rem;">[' + (i+1) + '] ' + (c.fileName || c.name || 'Source') + (c.trustLabel ? ' — ' + c.trustLabel : '') + '</span>'
            ).join(' ');
          }
          if (data.title) document.title = data.title + ' — LawLens';
        })
        .catch(err => {
          contentEl.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--error);">Content not found or expired.</div>';
        });
    }
  </script>
  <script src="https://unpkg.com/lucide@0.300.0/dist/umd/lucide.min.js"></script>
  <script>if(typeof lucide!=='undefined')lucide.createIcons();</script>
</body>
</html>
