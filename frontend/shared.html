<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./favicon-128.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Content — LawLens</title>
  <meta name="description" content="View shared legal research content on LawLens.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ui-enhancements.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container" style="max-width:700px;">
      <div class="auth-card" style="text-align:center;">
        <div class="auth-header">
          <div class="auth-logo"><img src="./logo.png" alt="LawLens"></div>
          <h1>Shared Content</h1>
          <p>Someone shared this with you on LawLens</p>
        </div>
        <div id="sharedLoading" style="padding:var(--spacing-xl);">
          <div class="spinner" style="margin:0 auto;"></div>
          <p style="margin-top:var(--spacing-md);color:var(--text-tertiary);">Loading shared content...</p>
        </div>
        <div id="sharedContent" style="display:none;text-align:left;"></div>
        <div id="sharedError" style="display:none;padding:var(--spacing-xl);">
          <i data-lucide="alert-circle" style="width:48px;height:48px;color:var(--color-danger);margin-bottom:var(--spacing-md);"></i>
          <h3>Content Not Found</h3>
          <p style="color:var(--text-tertiary);margin-top:var(--spacing-sm);">This shared link may have expired or been removed.</p>
        </div>
        <div style="margin-top:var(--spacing-xl);">
          <a href="./index.html" class="btn btn-primary">Go to LawLens</a>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/utils.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/shared.js"></script>
</body>
</html>
