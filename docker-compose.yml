services:
  lawlens:
    build: .
    container_name: lawlens
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - CORS_ORIGIN=https://lawlens.web.app,https://lawlens-f0ebc.web.app
      - DB_PATH=./database
      - UPLOAD_DIR=./uploads
      - VECTOR_DB_PATH=./vector/index.json
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    volumes:
      - lawlens_data:/app/backend/database
      - lawlens_uploads:/app/backend/uploads
      - lawlens_vector:/app/backend/vector
      - lawlens_datafiles:/app/backend/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  lawlens_data:
  lawlens_uploads:
  lawlens_vector:
  lawlens_datafiles:
